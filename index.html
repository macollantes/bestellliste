<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#ededed;font-family:Arial,Helvetica,sans-serif;color:#111}
body{padding-top:64px}
.page{max-width:900px;margin:auto;background:#fff;min-height:100vh;padding:12px 4px 120px}
h1{font-size:29px;line-height:1.15;margin:0 8px 18px}
.meta{display:grid;grid-template-columns:122px minmax(170px,1fr) 66px auto;gap:10px;align-items:center;margin:0 8px}
.meta strong{font-size:18px}
.meta input{width:100%;padding:12px 10px;border:1px solid #777;font-size:19px;background:#fff}
.dateValue{font-size:18px;font-weight:700;white-space:nowrap;padding-left:4px}
.bestellerLabel{grid-column:1}.bestellerInput{grid-column:2/5}
.orderHead{display:flex;align-items:center;justify-content:space-between;margin:22px 6px 8px}
.orderHead h2{font-size:26px;margin:0}
.badge{font-size:15px;font-weight:bold;background:#eee;padding:7px 11px;border-radius:18px}
.summaryTitleWrap{display:flex;align-items:center;gap:10px}
.summaryToggle{background:#fff;color:#222;border:1px solid #bbb;padding:6px 9px;font-size:13px;border-radius:14px}
#summaryWrap{display:none;margin:0 6px 14px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #aaa;vertical-align:middle}
.summary th{font-size:15px;padding:8px 6px;background:#eee;text-align:left}
.summary td{font-size:16px;padding:9px 6px}
.summary .nr{width:29%}.summary .anz{width:86px}
.accordion{margin:10px 6px;border:1px solid #aaa;border-radius:5px;overflow:hidden;background:#fff}
.accHead{width:100%;display:flex;align-items:center;justify-content:space-between;background:#f1f1f1;color:#111;border:0;border-radius:0;padding:16px 12px;font-size:23px;font-weight:700;text-align:left}
.accHead .left{display:flex;gap:9px;align-items:center}.arrow{font-size:18px;transition:.15s}.accHead.open .arrow{transform:rotate(90deg)}
.accCount{font-size:14px;background:#fff;border:1px solid #bbb;padding:5px 9px;border-radius:15px}
.accBody{display:none}.accBody.open{display:block}
.catalog .bild{width:72px}.catalog .anz{width:116px}
.catalog th{font-size:18px;padding:9px 6px;background:#eee;text-align:left}
.catalog td{padding:5px}
.catalog td.name{font-size:23px;font-weight:600;line-height:1.22;padding:13px 8px}
.thumbImg{width:64px;height:64px;display:block;margin:auto;object-fit:contain;background:#fff}
.qty{display:block;width:102px;height:62px;margin:auto;text-align:center;font-size:24px;font-weight:bold;border:1px solid #666;background:#fff;touch-action:manipulation;-webkit-appearance:none;border-radius:3px}
h2.section{font-size:24px;margin:22px 6px 9px}
.manualVertical{display:grid;grid-template-columns:1fr;gap:7px;padding:14px 12px 12px}
.manualVertical label{font-size:17px;font-weight:700;margin-top:2px}
.manualVertical .optional{font-weight:400;color:#777;font-size:14px}
.manualVertical input{width:100%;padding:13px 11px;font-size:20px;border:1px solid #777;background:#fff}
.manualVertical button{margin-top:4px}
.manualList{padding:0 12px 12px}
.manualRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-top:1px solid #ddd;padding:10px 0}
.manualRow .manualName{font-size:16px;font-weight:600}
.manualRow .manualQty{font-size:16px;font-weight:700}
.manualRow .manualRemove{padding:5px 8px;font-size:13px;background:#666}
button{border:0;border-radius:4px;background:#222;color:#fff;padding:14px;font-size:17px;font-weight:bold}
.pdf{display:block;width:calc(100% - 12px);margin:22px 6px 0;padding:16px;font-size:18px}
.remove{padding:2px 6px;font-size:12px;margin-left:5px}
.note{font-size:11px;color:#777;margin:9px 6px}
@media(max-width:600px){
 html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
 body{padding-top:78px}
 .page{width:100%;max-width:none;margin:0;padding-left:0;padding-right:0;padding-bottom:150px}
 h1{font-size:29px;margin-left:8px;margin-right:8px}
 .meta{grid-template-columns:108px minmax(135px,1fr) 58px auto;gap:7px;margin-left:10px;margin-right:10px}
 .meta strong{font-size:17px}.meta input{font-size:18px;padding:11px 8px}.dateValue{font-size:17px}
 .catalog .bild{width:70px}.catalog .anz{width:114px}
 .catalog th{font-size:18px}.catalog td.name{font-size:23px}
 .thumbImg{width:64px;height:64px}.qty{width:100px;height:62px;font-size:24px;touch-action:manipulation;-webkit-appearance:none}
 .accHead{font-size:23px;padding:16px 10px}

}

.colorDot{width:58px;height:58px;border-radius:50%;margin:auto;border:2px solid #777;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.colorDot.splitGY{background:linear-gradient(90deg,#2f9e44 0 50%,#ffd43b 50% 100%)}


@media(max-width:600px){
  .accordion{margin-left:0;margin-right:0;border-left:0;border-right:0;border-radius:0}
  .orderHead{margin-left:8px;margin-right:8px}
  #summaryWrap{margin-left:8px;margin-right:8px}
  h2.section{margin-left:8px;margin-right:8px}
  .manual{margin-left:8px;margin-right:8px}
  .pdf{width:calc(100% - 16px);margin-left:8px;margin-right:8px}
  input,select,textarea{font-size:20px!important}
  .qty{font-size:24px!important}
}

</style>
</head>
<body>
<div class="page">
<h1>Bestellliste</h1>

<div class="meta">
<strong>Kommission:</strong><input id="kommission" placeholder="Kommission">
<strong>Datum:</strong><div id="datumText" class="dateValue"></div>
<strong class="bestellerLabel">Bestellt von:</strong><input id="besteller" class="bestellerInput" placeholder="Name">
</div>

<div class="orderHead">
  <div class="summaryTitleWrap">
    <h2>Meine Bestellung</h2>
    <button id="toggleSummary" class="summaryToggle" type="button">Ausblenden</button>
  </div>
  <span id="count" class="badge">0 Artikel</span>
</div>
<div id="summaryWrap">
<table class="summary">
<colgroup><col><col class="nr"><col class="anz"></colgroup>
<thead><tr><th>Bezeichnung</th><th>E-Nummer</th><th>Anzahl</th></tr></thead>
<tbody id="summary"></tbody>
</table>
</div>

<div id="branches"></div>

<div class="accordion sonstigeAccordion">
  <button class="accHead" id="sonstigeHead" type="button">
    <span class="left"><span class="arrow">▶</span>Sonstige Artikel</span>
    <span class="accCount" id="sonstigeCount">0 Artikel</span>
  </button>
  <div class="accBody" id="sonstigeBody">
    <div class="manualVertical">
      <label>Bezeichnung</label>
      <input id="mDesc" placeholder="Bezeichnung">

      <label>E-Nummer <span class="optional">(optional)</span></label>
      <input id="mNr" placeholder="E-Nummer">

      <label>Anzahl</label>
      <input id="mQty" type="text" inputmode="text" maxlength="16" placeholder="z.B. 1 Pack">

      <button id="add">+ Artikel hinzufügen</button>
    </div>
    <div id="manualList" class="manualList"></div>
  </div>
</div>

<button id="pdf" class="pdf">PDF ERSTELLEN / DRUCKEN</button>
<div class="note">V4.3 – Sonstige als Akkordeon · Bestellung ein-/ausblendbar · Header verfeinert.</div>
</div>

let manual=[];
let summaryCollapsed=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const now=new Date(),pad=n=>String(n).padStart(2,'0');
const AUTO_DATE=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
const FILE_DATE=pad(now.getDate())+'-'+pad(now.getMonth()+1)+'-'+now.getFullYear();
$('datumText').textContent=AUTO_DATE;

function safeFilePart(s){
 return s.trim().replace(/[\/\\:*?"<>|]+/g,'').replace(/\s+/g,'_').replace(/_+/g,'_') || 'Ohne_Kommission';
}


function tDrahtColor(name){
 const n=name.toLowerCase();
 if(!n.startsWith('t-draht')) return null;
 if(n.includes('grün-gelb')||n.includes('gruen-gelb')) return {split:true};
 const colors=[
  ['braun','#8B5A2B'],['schwarz','#111111'],['grau','#8a8a8a'],
  ['hellblau','#4f87c7'],['weiss','#ffffff'],['violett','#8e44ad'],
  ['rot','#d62828'],['orange','#f28c28'],['beige','#d6c3a5'],['rosa','#e98bb3']
 ];
 for(const [key,val] of colors){ if(n.includes(key)) return {color:val}; }
 return null;
}

function buildBranches(){
 const host=$('branches');
 Object.entries(GROUPS).forEach(([group,items],gidx)=>{
  const box=document.createElement('div');box.className='accordion';
  box.innerHTML=`<button class="accHead" type="button">
    <span class="left"><span class="arrow">▶</span>${esc(group)}</span>
    <span class="accCount" id="gc-${gidx}">0 Artikel</span>
  </button>
  <div class="accBody">
    <table class="catalog">
      <colgroup><col class="bild"><col><col class="anz"></colgroup>
      <thead><tr><th>Bild</th><th>Bezeichnung</th><th>Anzahl</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>`;
  const head=box.querySelector('.accHead'),body=box.querySelector('.accBody'),tbody=box.querySelector('tbody');
  head.onclick=()=>{head.classList.toggle('open');body.classList.toggle('open');};
  items.forEach((x,i)=>{
   const tr=document.createElement('tr');
   const tdStyle=tDrahtColor(x.name);
   let visual;
   if(tdStyle){
     visual = tdStyle.split
       ? '<div class="colorDot splitGY" title="grün-gelb"></div>'
       : '<div class="colorDot" style="background:'+tdStyle.color+'" title="'+esc(x.name)+'"></div>';
   }else{
     visual='<img class="thumbImg" src="'+x.img+'" alt="">';
   }
   tr.innerHTML=`<td>${visual}</td>
   <td class="name">${esc(x.name)}</td>
   <td><input class="qty" type="text" inputmode="text" maxlength="16" data-group="${gidx}" data-i="${i}"></td>`;
   tbody.appendChild(tr);
  });
  host.appendChild(box);
 });
 document.querySelectorAll('.qty').forEach(q=>q.addEventListener('input',refresh));
}

function groupNames(){return Object.keys(GROUPS)}
function selected(){
 const rows=[];
 document.querySelectorAll('.qty').forEach(q=>{
  const v=(q.value||'').trim();
  if(v && v!=='0'){
   const g=Number(q.dataset.group),i=Number(q.dataset.i),name=groupNames()[g],x=GROUPS[name][i];
   rows.push({name:x.name,nr:x.nr,qty:v,group:name,manual:false});
  }
 });
 return rows.concat(manual);
}

function refresh(){
 const rows=selected();
 $('count').textContent=rows.length+' Artikel';
 $('sonstigeCount').textContent=manual.length+' Artikel';
 $('summaryWrap').style.display=(rows.length && !summaryCollapsed)?'block':'none';
 $('toggleSummary').style.display=rows.length?'inline-block':'none';
 $('toggleSummary').textContent=summaryCollapsed?'Einblenden':'Ausblenden';
 $('summary').innerHTML=rows.map(x=>`<tr><td>${esc(x.name)}${x.manual?` <button class="remove" data-rm="${x.mi}">×</button>`:''}</td><td>${esc(x.nr||'—')}</td><td><strong>${esc(x.qty)}</strong></td></tr>`).join('');
 groupNames().forEach((g,idx)=>{
  const n=rows.filter(x=>!x.manual && x.group===g).length;
  $('gc-'+idx).textContent=n+' Artikel';
 });
 $('manualList').innerHTML=manual.map((x,i)=>`
   <div class="manualRow">
     <div class="manualName">${esc(x.name)}${x.nr?'<br><span style="font-weight:400;color:#666;font-size:13px">'+esc(x.nr)+'</span>':''}</div>
     <div class="manualQty">${esc(x.qty)}</div>
     <button class="manualRemove" data-manual-rm="${i}" type="button">×</button>
   </div>`).join('');
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{manual.splice(Number(b.dataset.rm),1);manual.forEach((x,j)=>x.mi=j);refresh();});
 document.querySelectorAll('[data-manual-rm]').forEach(b=>b.onclick=()=>{manual.splice(Number(b.dataset.manualRm),1);manual.forEach((x,j)=>x.mi=j);refresh();});
}

$('add').onclick=()=>{
 const name=$('mDesc').value.trim(),nr=$('mNr').value.trim(),qty=$('mQty').value.trim();
 if(!name||!qty){alert('Bitte Bezeichnung und Anzahl eingeben.');return;}
 manual.push({name,nr,qty,group:'Sonstige',manual:true});manual.forEach((x,j)=>x.mi=j);
 $('mDesc').value='';$('mNr').value='';$('mQty').value='';refresh();
};


$('toggleSummary').onclick=()=>{
 summaryCollapsed=!summaryCollapsed;
 refresh();
};

$('sonstigeHead').onclick=()=>{
 $('sonstigeHead').classList.toggle('open');
 $('sonstigeBody').classList.toggle('open');
};

$('pdf').onclick=()=>{
 const k=$('kommission').value.trim(),b=$('besteller').value.trim(),rows=selected();
 if(!k){alert('Bitte Kommission eingeben.');return;}
 if(!b){alert('Bitte Bestellt von eingeben.');return;}
 if(!rows.length){alert('Die Bestellung ist leer.');return;}
 const filename='Bestellung_'+safeFilePart(k)+'_'+FILE_DATE;
 const w=window.open('','_blank');
 const rowsHtml=rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.nr||'—')}</td><td class="q">${esc(x.qty)}</td></tr>`).join('');
 w.document.open();
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(filename)}</title>
 <style>
 *{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:28px 34px;color:#14213d}
 .head{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:30px;font-weight:800;letter-spacing:.5px;margin-top:6px}
 .logo{width:175px;height:auto;object-fit:contain}.rule{height:5px;background:linear-gradient(90deg,#314e76 0 74%,#f4a300 74% 100%);margin:14px 0 18px}
 .meta{display:grid;grid-template-columns:1fr 160px 180px;gap:16px;margin-bottom:20px}
 .metaBox{border-left:4px solid #314e76;padding-left:9px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#657080;font-weight:700}
 .value{font-size:15px;font-weight:700;margin-top:3px;color:#111}
 table{width:100%;border-collapse:collapse}.nr{width:29%}.qty{width:92px}
 th{background:#314e76;color:#fff;text-align:left;font-size:12px;padding:9px 8px}td{border-bottom:1px solid #c8ced7;padding:9px 8px;font-size:13px;color:#111}
 td.q{text-align:center;font-weight:800;font-size:14px}
 .footer{margin-top:24px;border-top:1px solid #d5d8dd;padding-top:8px;font-size:9px;color:#7a8088;text-align:right}
 @media print{body{padding:0 5px}.logo{width:165px}}
 </style></head><body>
 <div class="head"><div class="title">BESTELLUNG</div><img class="logo" src="${LOGO}"></div>
 <div class="rule"></div>
 <div class="meta">
   <div class="metaBox"><div class="label">Kommission</div><div class="value">${esc(k)}</div></div>
   <div class="metaBox"><div class="label">Datum</div><div class="value">${AUTO_DATE}</div></div>
   <div class="metaBox"><div class="label">Bestellt von</div><div class="value">${esc(b)}</div></div>
 </div>
 <table><colgroup><col><col class="nr"><col class="qty"></colgroup>
 <thead><tr><th>Bezeichnung</th><th>E-Nummer</th><th>Anzahl</th></tr></thead><tbody>${rowsHtml}</tbody></table>
 <div class="footer">Digital erstellte Bestellliste</div>
 <script>window.onload=()=>setTimeout(()=>window.print(),450);<\/script>
 </body></html>`);
 w.document.close();
};

buildBranches();
refresh();
</script>
</body>
</html>
